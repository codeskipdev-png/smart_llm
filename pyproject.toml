[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-llm"
version = "0.1.0"
description = "Confidence-Driven Knowledge Arbitration and Adaptive Adapter Scaling for Explainable Few-Shot LLM Text Classification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "peft>=0.12",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "captum>=0.7",
    "datasets>=2.20",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["smart_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
